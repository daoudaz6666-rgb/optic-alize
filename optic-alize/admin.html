<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Administration | Optic Alizé</title>
<link rel="icon" type="image/png" href="logo-optic-alize.png">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #EEF1F2; }
  #admin-app {
    min-height: 100vh;
    font-family: var(--font-cg);
    font-size: 17px;
    color: var(--encre);
  }

  .ad-btn {
    font-family: var(--font-cg); font-size: 1rem; font-weight: 600;
    padding: 11px 20px; border-radius: 10px; border: 1px solid var(--ligne);
    background: #fff; color: var(--encre); cursor: pointer;
  }
  .ad-btn:hover { background: var(--sable); }
  .ad-btn--primary { background: var(--encre); color: #fff; border-color: var(--encre); }
  .ad-btn--primary:hover { background: var(--turquoise-fonce); }
  .ad-btn--ghost { background: transparent; }

  /* ---- login ---- */
  .ad-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .ad-login-card {
    background: #fff; border: 1px solid var(--ligne); border-radius: 18px;
    padding: 44px; width: min(460px, 100%); box-shadow: 0 24px 60px rgba(18,48,61,0.12);
    text-align: center;
  }
  .ad-logo-img { width: auto; max-width: 100%; object-fit: contain; align-self: center; }
  .ad-login-card .ad-logo-img { height: 96px; margin: 0 auto 10px; }
  .ad-login-card h1 { font-size: 2rem; margin: 10px 0 6px; }
  .ad-login-card p { color: var(--nuage); font-size: 1.02rem; }
  .ad-login-card form { display: flex; flex-direction: column; gap: 16px; margin: 26px 0 18px; text-align: left; }
  .ad-login-card label { display: flex; flex-direction: column; gap: 7px; font-size: 0.98rem; font-weight: 600; }
  .ad-login-card input {
    border: 1px solid var(--ligne); border-radius: 10px; padding: 13px 15px;
    font-family: var(--font-cg); font-size: 1.05rem;
  }
  .ad-login-card input:focus { outline: none; border-color: var(--turquoise); }
  .ad-alert { background: #fdecea; color: #a23; border-radius: 10px; padding: 12px 14px; font-size: 0.98rem; margin-bottom: 6px; text-align: left; }
  .ad-hint { font-size: 0.9rem; color: var(--nuage); }
  .ad-hint code, .ad-back code { background: var(--sable-fonce); padding: 2px 6px; border-radius: 5px; font-size: 0.92em; }
  .ad-back a { color: var(--turquoise-fonce); font-weight: 600; font-size: 0.95rem; }

  /* ---- shell ---- */
  .ad-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .ad-side { background: var(--encre); color: var(--sable); padding: 26px 18px; display: flex; flex-direction: column; }
  .ad-side .ad-logo-img {
    align-self: flex-start;
    height: 58px; width: auto;
    background: #fff; padding: 9px 13px; border-radius: 12px; margin-bottom: 26px;
  }
  .ad-side nav { display: flex; flex-direction: column; gap: 5px; }
  .ad-side nav button {
    text-align: left; background: none; border: none; color: rgba(246,242,234,0.8);
    font-family: var(--font-cg); font-size: 1.05rem; font-weight: 500;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
  }
  .ad-side nav button:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .ad-side nav button.actif { background: var(--turquoise); color: #fff; }
  .ad-side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 22px; }
  .ad-side-foot a { color: rgba(246,242,234,0.7); font-size: 0.95rem; }
  .ad-side-foot button {
    background: none; border: 1px solid rgba(246,242,234,0.25); color: var(--sable);
    font-family: var(--font-cg);
    padding: 10px; border-radius: 10px; font-size: 0.95rem; cursor: pointer;
  }
  .ad-main { padding: 38px 40px; overflow-x: hidden; }
  .ad-main h1 { font-size: 2.1rem; margin-bottom: 24px; }
  .ad-main h1 span { color: var(--nuage); font-size: 1.15rem; font-family: var(--font-cg); }

  .ad-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
  .ad-head h1 { margin: 0; }
  .ad-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .ad-note {
    background: #fff8e6; border: 1px solid #f0dca6; color: #6b5417;
    border-radius: 12px; padding: 14px 16px; font-size: 0.98rem; margin-bottom: 24px;
  }
  .ad-empty { color: var(--nuage); font-size: 1.05rem; }

  /* ---- cards ---- */
  .ad-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .ad-card { background: #fff; border: 1px solid var(--ligne); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
  .ad-card-v { font-family: var(--font-cg); font-size: 2.3rem; font-weight: 600; color: var(--encre); line-height: 1.1; }
  .ad-card-l { font-size: 0.95rem; color: var(--nuage); }

  /* ---- charts ---- */
  .ad-charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .ad-chart { background: #fff; border: 1px solid var(--ligne); border-radius: 14px; padding: 22px; }
  .ad-chart h3 { font-size: 1.25rem; margin-bottom: 16px; }
  .ad-bar { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 0.95rem; }
  .ad-bar-l { color: var(--nuage); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ad-bar-t { background: var(--sable-fonce); border-radius: 999px; height: 12px; overflow: hidden; }
  .ad-bar-t span { display: block; height: 100%; background: var(--turquoise); border-radius: 999px; }
  .ad-bar-v { text-align: right; font-weight: 600; font-size: 0.92rem; color: var(--encre); }

  /* ---- table ---- */
  .ad-table-wrap { background: #fff; border: 1px solid var(--ligne); border-radius: 14px; overflow-x: auto; }
  .ad-table { width: 100%; border-collapse: collapse; font-size: 1rem; }
  .ad-table th, .ad-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--ligne); white-space: nowrap; }
  .ad-table th { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--nuage); font-weight: 600; }
  .ad-table tr:last-child td { border-bottom: none; }
  .ad-table td { text-transform: capitalize; }
  .ad-clip { text-transform: none; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  .ad-thumb { width: 62px; }
  .ad-thumb img, .ad-thumb svg { width: 50px; height: 38px; object-fit: cover; border-radius: 7px; background: var(--sable-fonce); }
  .ad-row-act { text-align: right; }
  .ad-row-act button { background: none; border: none; color: var(--turquoise-fonce); font-family: var(--font-cg); font-weight: 600; font-size: 0.95rem; cursor: pointer; padding: 5px 8px; }
  .ad-row-act button.danger { color: var(--corail); }

  /* ---- modal / form ---- */
  .ad-modal-ov { position: fixed; inset: 0; background: rgba(18,48,61,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 1000; }
  .ad-modal { background: #fff; border-radius: 16px; width: min(580px, 100%); }
  .ad-modal-h { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--ligne); }
  .ad-modal-h h2 { margin: 0; font-size: 1.45rem; }
  .ad-modal-x { background: none; border: none; font-size: 1.7rem; cursor: pointer; color: var(--nuage); line-height: 1; }
  .ad-form { padding: 22px 24px; }
  .ad-field { margin-bottom: 16px; }
  .ad-field label { display: block; font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
  .ad-field input, .ad-field select, .ad-field textarea {
    width: 100%; border: 1px solid var(--ligne); border-radius: 10px; padding: 11px 13px;
    font-family: var(--font-cg); font-size: 1rem;
  }
  .ad-field input:focus, .ad-field select:focus, .ad-field textarea:focus { outline: none; border-color: var(--turquoise); }
  .ad-field textarea { min-height: 80px; resize: vertical; }
  .ad-check { display: flex !important; align-items: center; gap: 9px; font-weight: 500 !important; font-size: 0.98rem; }
  .ad-check input { width: auto !important; }
  .ad-modal-f { display: flex; justify-content: flex-end; gap: 12px; padding-top: 10px; }

  @media (max-width: 820px) {
    .ad-shell { grid-template-columns: 1fr; }
    .ad-side { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px; }
    .ad-side .ad-logo-img { margin: 0; height: 46px; }
    .ad-side nav { flex-direction: row; flex-wrap: wrap; }
    .ad-side-foot { margin: 0; flex-direction: row; padding: 0; }
    .ad-main { padding: 22px 16px; }
    #admin-app { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="admin-app"></div>

<script src="js/admin-config.js"></script>
<script src="js/produits.js"></script>
<script src="js/verres.js"></script>
<script src="js/publications.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
